<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<canvas id="chart"></canvas>

<script>

fetch("/stress_data")
.then(res => res.json())
.then(data => {

new Chart(document.getElementById("chart"),{

type:"bar",

data:{
labels:["Low","Moderate","High"],
datasets:[{
label:"Student Stress Levels",
data:data
}]
}

})

})

</script>
